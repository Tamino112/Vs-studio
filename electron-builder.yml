appId: com.tamino112.vsstudiocommunity
productName: Visual Studio Community
copyright: Private Use Only
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.svg
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  darkModeSupport: true
dmg:
  title: Visual Studio Community (.NET 10)
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
extraMetadata:
  main: dist-electron/main.js
